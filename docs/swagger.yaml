basePath: /api/v1
definitions:
  github_com_vitikevich-landau_clients-api_internal_apperr.Code:
    enum:
    - validation_error
    - unauthorized
    - forbidden
    - not_found
    - method_not_allowed
    - conflict
    - timeout
    - internal_error
    type: string
    x-enum-comments:
      CodeConflict: нарушение уникальности / бизнес-правила
      CodeForbidden: токен есть, но прав не хватает
      CodeInternal: всё остальное, наша вина
      CodeMethodNotAllowed: путь есть, метод не тот
      CodeNotFound: объект не существует
      CodeTimeout: не уложились в отведённое время
      CodeUnauthorized: нет токена или он невалиден
      CodeValidation: невалидные входные данные
    x-enum-descriptions:
    - невалидные входные данные
    - нет токена или он невалиден
    - токен есть, но прав не хватает
    - объект не существует
    - путь есть, метод не тот
    - нарушение уникальности / бизнес-правила
    - не уложились в отведённое время
    - всё остальное, наша вина
    x-enum-varnames:
    - CodeValidation
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeMethodNotAllowed
    - CodeConflict
    - CodeTimeout
    - CodeInternal
  github_com_vitikevich-landau_clients-api_internal_model.ApproveSuggestionRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: |-
          ExpiresIn — сколько СЕКУНД токен ещё живёт.
          Относительное время, а не абсолютное: клиенту не нужно
          иметь правильно выставленные часы, чтобы понять срок.
        type: integer
      token_type:
        description: |-
          TokenType всегда "Bearer" — подсказка клиенту, что токен
          надо слать в заголовке Authorization: Bearer <token>.
        type: string
      user:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.UserResponse'
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.ClientResponse:
    properties:
      company:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientStatus'
      updated_at:
        type: string
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.ClientStatus:
    enum:
    - active
    - archived
    type: string
    x-enum-comments:
      ClientStatusActive: работаем с клиентом
      ClientStatusArchived: в архиве, но не удалён
    x-enum-descriptions:
    - работаем с клиентом
    - в архиве, но не удалён
    x-enum-varnames:
    - ClientStatusActive
    - ClientStatusArchived
  github_com_vitikevich-landau_clients-api_internal_model.CreateClientRequest:
    properties:
      company:
        maxLength: 200
        type: string
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 200
        minLength: 1
        type: string
      notes:
        maxLength: 2000
        type: string
      phone:
        maxLength: 50
        minLength: 3
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientStatus'
        description: Если статус не передали, применится ClientStatusActive.
        enum:
        - active
        - archived
    required:
    - full_name
    type: object
  ? github_com_vitikevich-landau_clients-api_internal_model.ListResponse-github_com_vitikevich-landau_clients-api_internal_model_ClientResponse
  : properties:
      items:
        items:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Pagination'
    type: object
  ? github_com_vitikevich-landau_clients-api_internal_model.ListResponse-github_com_vitikevich-landau_clients-api_internal_model_SuggestionResponse
  : properties:
      items:
        items:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Pagination'
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  ? github_com_vitikevich-landau_clients-api_internal_model.Optional-github_com_vitikevich-landau_clients-api_internal_model_ClientStatus
  : properties:
      present:
        description: Present — ключ присутствовал во входном JSON.
        type: boolean
      value:
        allOf:
        - $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientStatus'
        description: Value — само значение. nil при Present=true означает явный null.
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.Optional-string:
    properties:
      present:
        description: Present — ключ присутствовал во входном JSON.
        type: boolean
      value:
        description: Value — само значение. nil при Present=true означает явный null.
        type: string
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        description: |-
          max=72 — это не каприз, а ограничение bcrypt: алгоритм работает
          максимум с 72 байтами. Более длинные пароли современные версии
          x/crypto отвергают ошибкой (старые молча обрезали, что было хуже:
          пароли "…длинный…AAA" и "…длинный…BBB" оказывались одинаковыми).
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.RejectSuggestionRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 1
        type: string
    required:
    - comment
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.Role:
    enum:
    - user
    - admin
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
  github_com_vitikevich-landau_clients-api_internal_model.SuggestionPayload:
    properties:
      company:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Optional-string'
      email:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Optional-string'
      full_name:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Optional-string'
      notes:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Optional-string'
      phone:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Optional-string'
      status:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Optional-github_com_vitikevich-landau_clients-api_internal_model_ClientStatus'
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.SuggestionResponse:
    properties:
      author_email:
        description: |-
          Поля из связанных таблиц. Заполняются не всегда,
          поэтому omitempty — чтобы не слать пустые строки без нужды.
        type: string
      author_id:
        type: string
      changed_fields:
        description: |-
          ChangedFields — плоский список имён полей.
          Дублирует информацию из payload, но позволяет фронтенду
          нарисовать "предложено изменить: телефон, заметки"
          без разбора структуры payload.
        items:
          type: string
        type: array
      client_id:
        type: string
      client_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      payload:
        allOf:
        - $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionPayload'
        description: |-
          Payload сериализуется нашим MarshalJSON — то есть содержит
          только те поля, которые реально предложены к изменению.
      review_comment:
        type: string
      reviewed_at:
        type: string
      reviewer_email:
        type: string
      reviewer_id:
        type: string
      status:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionStatus'
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.SuggestionStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-comments:
      SuggestionStatusApproved: одобрено и применено
      SuggestionStatusPending: ждёт модерации
      SuggestionStatusRejected: отклонено
    x-enum-descriptions:
    - ждёт модерации
    - одобрено и применено
    - отклонено
    x-enum-varnames:
    - SuggestionStatusPending
    - SuggestionStatusApproved
    - SuggestionStatusRejected
  github_com_vitikevich-landau_clients-api_internal_model.UpdateClientRequest:
    properties:
      company:
        maxLength: 200
        type: string
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 200
        minLength: 1
        type: string
      notes:
        maxLength: 2000
        type: string
      phone:
        maxLength: 50
        minLength: 3
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientStatus'
        enum:
        - active
        - archived
    required:
    - full_name
    type: object
  github_com_vitikevich-landau_clients-api_internal_model.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.Role'
    type: object
  github_com_vitikevich-landau_clients-api_internal_response.ErrorBody:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_apperr.Code'
        description: |-
          Code — машиночитаемый код: not_found, validation_error, ...
          Клиент принимает решения ПО КОДУ, а не по тексту:
          текст можно переписать или перевести, код — контракт.
      details:
        additionalProperties:
          type: string
        description: |-
          Details — пояснения по конкретным полям при ошибке валидации.
          omitempty: в остальных случаях ключа в JSON просто не будет.
        type: object
      message:
        description: |-
          Message — человекочитаемое описание. Безопасное: без имён таблиц,
          SQL и стектрейсов.
        type: string
      request_id:
        description: |-
          RequestID — чтобы пользователь мог назвать его в поддержке,
          а мы по нему нашли весь запрос в логах.
        type: string
    type: object
  github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorBody'
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Учебный продакшн-подобный сервис учёта клиентов.

    Ключевая механика: обычный пользователь не редактирует карточку
    клиента напрямую — он ПРЕДЛАГАЕТ правку, которая применяется
    только после одобрения администратором.

    Демо-учётки (заводятся миграцией 00004):
    admin@example.com / admin12345 — роль admin
    user@example.com / user12345 — роль user
  title: Clients API
  version: "1.0"
paths:
  /admin/clients:
    post:
      consumes:
      - application/json
      description: Доступно только администратору.
      parameters:
      - description: Данные клиента
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "409":
          description: Email уже занят другим клиентом
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать клиента
      tags:
      - admin
  /admin/clients/{id}:
    delete:
      description: |-
        Мягкое удаление: строка остаётся в базе с меткой deleted_at,
        но исчезает из всех выдач.
      parameters:
      - description: UUID клиента
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Удалено, тела ответа нет
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Уже удалён или не существует
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить клиента
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: |-
        Доступно только администратору. PUT означает ПОЛНУЮ ЗАМЕНУ:
        непереданные необязательные поля будут очищены.
      parameters:
      - description: UUID клиента
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные клиента
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.UpdateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменить клиента
      tags:
      - admin
  /admin/suggestions:
    get:
      description: |-
        Все предложения всех авторов. Доступно только администратору.
        Обычный сценарий: ?status=pending — что ждёт рассмотрения.
      parameters:
      - description: Фильтр по статусу
        enum:
        - pending
        - approved
        - rejected
        in: query
        name: status
        type: string
      - description: Фильтр по клиенту (UUID)
        in: query
        name: client_id
        type: string
      - default: 20
        description: Записей на страницу (1..100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Сколько пропустить
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ListResponse-github_com_vitikevich-landau_clients-api_internal_model_SuggestionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Очередь модерации
      tags:
      - admin
  /admin/suggestions/{id}/approve:
    post:
      consumes:
      - application/json
      description: |-
        Атомарно применяет payload к карточке клиента и переводит
        предложение в статус approved. Только для администратора.
      parameters:
      - description: UUID предложения
        in: path
        name: id
        required: true
        type: string
      - description: Необязательный комментарий
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ApproveSuggestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Предложение не найдено
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "409":
          description: Уже рассмотрено, клиент удалён или email занят
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Одобрить предложение
      tags:
      - admin
  /admin/suggestions/{id}/reject:
    post:
      consumes:
      - application/json
      description: |-
        Переводит предложение в статус rejected. Комментарий
        обязателен — автор должен понимать причину отказа.
        Только для администратора.
      parameters:
      - description: UUID предложения
        in: path
        name: id
        required: true
        type: string
      - description: Причина отказа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.RejectSuggestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionResponse'
        "400":
          description: Не указан комментарий
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "409":
          description: Уже рассмотрено
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отклонить предложение
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает JWT для доступа к защищённым эндпоинтам.
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.AuthResponse'
        "400":
          description: Не прошла валидация
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Неверный email или пароль
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает актуальные данные владельца токена из базы.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.UserResponse'
        "401":
          description: Нет или невалиден токен
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Пользователь удалён
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Создаёт пользователя с ролью user и сразу возвращает JWT.
        Роль admin через этот эндпоинт получить нельзя.
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.AuthResponse'
        "400":
          description: Не прошла валидация
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "409":
          description: Email уже занят
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /clients:
    get:
      description: |-
        Постраничная выдача с поиском по имени и компании,
        фильтром по статусу и сортировкой.
      parameters:
      - description: Поиск по имени или компании
        in: query
        name: search
        type: string
      - description: Фильтр по статусу
        enum:
        - active
        - archived
        in: query
        name: status
        type: string
      - default: 20
        description: Записей на страницу (1..100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Сколько пропустить
        in: query
        name: offset
        type: integer
      - default: created_at
        description: Поле сортировки
        enum:
        - created_at
        - updated_at
        - full_name
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Направление
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ListResponse-github_com_vitikevich-landau_clients-api_internal_model_ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список клиентов
      tags:
      - clients
  /clients/{id}:
    get:
      parameters:
      - description: UUID клиента
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ClientResponse'
        "400":
          description: Некорректный UUID
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Клиент не найден или удалён
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Карточка клиента
      tags:
      - clients
  /clients/{id}/suggestions:
    post:
      consumes:
      - application/json
      description: |-
        Карточка клиента НЕ меняется. Создаётся предложение
        со статусом pending, которое рассмотрит администратор.
        Тело — частичное изменение по правилам JSON Merge Patch:
        значение = заменить, null = очистить, отсутствие ключа = не трогать.
      parameters:
      - description: UUID клиента
        in: path
        name: id
        required: true
        type: string
      - description: Предлагаемые изменения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionResponse'
        "400":
          description: Пустой или невалидный payload
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Клиент не найден
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "409":
          description: У вас уже есть нерассмотренное предложение по этому клиенту
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Предложить правку клиента
      tags:
      - suggestions
  /healthz:
    get:
      description: Всегда 200, если процесс отвечает. Внешние зависимости не проверяет.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Проба живучести
      tags:
      - health
  /readyz:
    get:
      description: Проверяет доступность базы. 503, если база не отвечает.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: База недоступна
          schema:
            additionalProperties: true
            type: object
      summary: Проба готовности
      tags:
      - health
  /suggestions/{id}:
    get:
      description: Обычный пользователь видит только свои предложения.
      parameters:
      - description: UUID предложения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.SuggestionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "404":
          description: Не найдено либо принадлежит другому пользователю
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Одно предложение
      tags:
      - suggestions
  /suggestions/my:
    get:
      description: |-
        Показывает только предложения, созданные текущим пользователем,
        вместе с их статусами и комментариями модератора.
      parameters:
      - description: Фильтр по статусу
        enum:
        - pending
        - approved
        - rejected
        in: query
        name: status
        type: string
      - description: Фильтр по клиенту (UUID)
        in: query
        name: client_id
        type: string
      - default: 20
        description: Записей на страницу (1..100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Сколько пропустить
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_model.ListResponse-github_com_vitikevich-landau_clients-api_internal_model_SuggestionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vitikevich-landau_clients-api_internal_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои предложения
      tags:
      - suggestions
securityDefinitions:
  BearerAuth:
    description: 'Введите: Bearer <ваш JWT>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
