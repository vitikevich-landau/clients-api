# Локальное окружение: Postgres + сервис.
#
# Запуск:  make up   (или docker compose up -d --build)
#
# Ключ "version:" намеренно отсутствует — начиная с Docker Compose v2
# он устарел и вызывает предупреждение.

services:
  # ==========================================================================
  #  База данных
  # ==========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: clients-api-postgres

    environment:
      POSTGRES_USER: clients
      POSTGRES_PASSWORD: clients_dev_password
      POSTGRES_DB: clients

      # Ускоряет первичную инициализацию кластера в разработке.
      # Для локальной машины безопасно, В ПРОДЕ ТАК ДЕЛАТЬ НЕЛЬЗЯ:
      # trust означает вход в базу вообще без пароля.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    ports:
      # Пробрасываем наружу, чтобы можно было подключиться psql
      # или GUI-клиентом с хоста.
      - "5432:5432"

    volumes:
      # Именованный том: данные переживают перезапуск и пересоздание
      # контейнера. Удаляется только явно — docker compose down -v.
      - postgres_data:/var/lib/postgresql/data

    # ПРОВЕРКА ГОТОВНОСТИ — без неё вся конструкция разваливается.
    #
    # Postgres поднимается несколько секунд. Сервис, стартовавший раньше,
    # не сможет применить миграции и упадёт. depends_on без condition
    # ждёт только ЗАПУСКА контейнера, а не готовности базы принимать
    # соединения — это две очень разные вещи.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clients -d clients"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  # ==========================================================================
  #  Сервис
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev-compose

    container_name: clients-api

    depends_on:
      postgres:
        # Ждём именно ЗДОРОВЬЯ базы, а не факта запуска контейнера.
        condition: service_healthy

    environment:
      APP_ENV: local

      HTTP_PORT: 8080
      HTTP_REQUEST_TIMEOUT: 10s
      # Пусто = CORS выключен. Для локального фронта впиши,
      # например: http://localhost:3000
      HTTP_CORS_ALLOWED_ORIGINS: ""

      # ВАЖНО: postgres, а не localhost.
      # Внутри compose-сети контейнеры видят друг друга по ИМЕНИ СЕРВИСА.
      # localhost внутри контейнера api указывает на сам контейнер api,
      # где никакой базы нет.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: clients
      DB_PASSWORD: clients_dev_password
      DB_NAME: clients
      DB_SSLMODE: disable
      DB_MAX_CONNS: 10
      DB_MIN_CONNS: 2

      # ДЕМО-СЕКРЕТ. В проде значение приходит из хранилища секретов
      # (Vault, AWS Secrets Manager, k8s Secret), а не из файла в git.
      JWT_SECRET: "local-development-secret-key-change-me-in-production"
      JWT_TTL: 24h

      LOG_LEVEL: debug
      # text — человекочитаемый цветной вывод для локальной разработки.
      # В проде json.
      LOG_FORMAT: text
      LOG_ADD_SOURCE: "true"

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  postgres_data:
